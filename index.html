<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App Finanzas</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #10b981;
      --danger: #ef4444;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 90px; }

    /* Barra TRM USD/COP */
    .trm-bar {
      background: #0f172a;
      color: #38bdf8;
      font-size: 0.75rem;
      font-weight: 600;
      text-align: center;
      padding: 6px 12px;
      letter-spacing: 0.3px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .offline-banner { background: #fef3c7; color: #92400e; padding: 8px; font-size: 0.8rem; text-align: center; display: none; }
    .offline-banner.active { display: block; }

    header { background: var(--surface); padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.1rem; font-weight: 700; }

    main { padding: 20px; }

    .kpi-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
    .kpi-card { background: var(--surface); padding: 16px; border-radius: var(--radius); border: 1px solid var(--border); }
    .kpi-card.full-width { grid-column: span 2; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; }
    .kpi-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.8; margin-bottom: 6px; }
    .kpi-value { font-size: 1.4rem; font-weight: 700; }

    .charts-container { display: flex; flex-direction: column; gap: 20px; margin-bottom: 20px; }
    .chart-card { background: var(--surface); padding: 16px; border-radius: var(--radius); border: 1px solid var(--border); }
    .chart-card h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 12px; }
    .chart-wrapper { position: relative; height: 220px; }

    .section-title { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }
    .tx-list { display: flex; flex-direction: column; gap: 10px; }
    .tx-item { background: var(--surface); padding: 14px; border-radius: 12px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .tx-info h4 { font-size: 0.9rem; font-weight: 600; }
    .tx-info p { font-size: 0.75rem; color: var(--text-muted); }
    .tx-amount { text-align: right; }
    .tx-amount.ingreso { color: var(--success); font-weight: 700; }
    .tx-amount.gasto { color: var(--danger); font-weight: 700; }
    .tx-actions { display: flex; gap: 8px; margin-top: 6px; justify-content: flex-end; }
    .btn-icon { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 2px; }
    .btn-icon:hover { color: var(--text); }
    .btn-icon.delete:hover { color: var(--danger); }

    .fab { position: fixed; bottom: 28px; right: 20px; width: 58px; height: 58px; background-color: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4); border: none; cursor: pointer; z-index: 99; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); z-index: 100; opacity: 0; visibility: hidden; transition: 0.3s ease; }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .bottom-sheet { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--surface); border-radius: 24px 24px 0 0; padding: 24px 20px; z-index: 101; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); max-height: 90vh; overflow-y: auto; }
    .modal-overlay.active .bottom-sheet { transform: translateY(0); }
    .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
    .form-control { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; outline: none; background: var(--bg); }

    .type-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: var(--bg); padding: 4px; border-radius: 12px; margin-bottom: 14px; }
    .type-btn { padding: 10px; border: none; border-radius: 8px; background: transparent; font-weight: 600; color: var(--text-muted); cursor: pointer; }
    .type-btn.active[data-type="Gasto"] { background: var(--surface); color: var(--danger); }
    .type-btn.active[data-type="Ingreso"] { background: var(--surface); color: var(--success); }

    .btn-submit { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; }

    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.8); display: flex; justify-content: center; align-items: center; z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .loading-overlay.active { opacity: 1; pointer-events: all; }
    .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Barra Superior TRM USD/COP -->
  <div id="trm-bar" class="trm-bar">
    <span>💵 TRM USD/COP: Cargando tasa...</span>
  </div>

  <div id="offline-banner" class="offline-banner">⚠️ Sin conexión. Cambios locales pendientes.</div>

  <div id="loading-overlay" class="loading-overlay">
    <div class="spinner"></div>
  </div>

  <header>
    <h1>Finanzas Personales</h1>
    <span class="material-symbols-rounded" style="color: var(--text-muted);">account_circle</span>
  </header>

  <main>
    <div class="kpi-container">
      <div class="kpi-card full-width">
        <div class="kpi-label">Balance Total</div>
        <div class="kpi-value" id="total-balance">$0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label" style="color: var(--success);">Ingresos</div>
        <div class="kpi-value" id="total-ingresos" style="color: var(--success);">$0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label" style="color: var(--danger);">Gastos</div>
        <div class="kpi-value" id="total-gastos" style="color: var(--danger);">$0</div>
      </div>
    </div>

    <div class="charts-container">
      <div class="chart-card">
        <h3>Gastos por Categoría</h3>
        <div class="chart-wrapper"><canvas id="chartCategorias"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>Tendencia Mensual</h3>
        <div class="chart-wrapper"><canvas id="chartTendencia"></canvas></div>
      </div>
    </div>

    <h3 class="section-title">Movimientos Recientes</h3>
    <div class="tx-list" id="tx-list"></div>
  </main>

  <button class="fab" id="open-modal-btn"><span class="material-symbols-rounded">add</span></button>

  <div class="modal-overlay" id="modal-overlay">
    <div class="bottom-sheet">
      <div class="sheet-header">
        <h2 id="modal-title">Registrar Movimiento</h2>
        <button class="btn-icon" id="close-modal-btn"><span class="material-symbols-rounded">close</span></button>
      </div>

      <form id="transaction-form">
        <input type="hidden" id="edit-row-index" value="">

        <div class="type-selector">
          <button type="button" class="type-btn active" data-type="Gasto">Gasto</button>
          <button type="button" class="type-btn" data-type="Ingreso">Ingreso</button>
        </div>
        <input type="hidden" id="tipo" value="Gasto">

        <div class="form-group">
          <label>Monto ($)</label>
          <input type="number" id="monto" class="form-control" placeholder="0.00" step="any" required inputmode="decimal">
        </div>

        <div class="form-group">
          <label>Categoría</label>
          <select id="categoria" class="form-control" required>
            <option value="" disabled selected>Selecciona</option>
            <option value="Alimentación">Alimentación</option>
            <option value="Transporte">Transporte</option>
            <option value="Vivienda">Vivienda</option>
            <option value="Entretenimiento">Entretenimiento</option>
            <option value="Servicios">Servicios</option>
            <option value="Sueldo">Sueldo</option>
            <option value="Otros">Otros</option>
          </select>
        </div>

        <div class="form-group">
          <label>Descripción</label>
          <input type="text" id="descripcion" class="form-control" placeholder="Ej. Almuerzo">
        </div>

        <div class="form-group">
          <label>Fecha</label>
          <input type="date" id="fecha" class="form-control" required>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">Guardar</button>
      </form>
    </div>
  </div>

  <script>
    // PON TU URL DE APPS SCRIPT AQUÍ:
    const URL_WEB_APP = 'https://script.google.com/macros/s/TU_SCRIPT_ID_AQUI/exec';

    const openModalBtn = document.getElementById('open-modal-btn');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const modalOverlay = document.getElementById('modal-overlay');
    const typeBtns = document.querySelectorAll('.type-btn');
    const inputTipo = document.getElementById('tipo');
    const inputFecha = document.getElementById('fecha');
    const transactionForm = document.getElementById('transaction-form');
    const editRowIndexInput = document.getElementById('edit-row-index');
    const modalTitle = document.getElementById('modal-title');

    const totalBalanceEl = document.getElementById('total-balance');
    const totalIngresosEl = document.getElementById('total-ingresos');
    const totalGastosEl = document.getElementById('total-gastos');
    const txListEl = document.getElementById('tx-list');
    const loadingOverlay = document.getElementById('loading-overlay');
    const offlineBanner = document.getElementById('offline-banner');
    const trmBarEl = document.getElementById('trm-bar');

    let chartCatInstance = null;
    let chartTenInstance = null;
    let cacheTransacciones = [];

    inputFecha.value = new Date().toISOString().split('T')[0];

    function mostrarCargando(v) { loadingOverlay.classList.toggle('active', v); }

    // Función para obtener la TRM en vivo (USD a COP)
    async function obtenerTRM() {
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/USD');
        const data = await res.json();
        if (data && data.rates && data.rates.COP) {
          const trm = data.rates.COP;
          const fmt = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 2 });
          trmBarEl.innerHTML = `🇺🇸 TRM USD/COP: <strong>${fmt.format(trm)}</strong>`;
        }
      } catch (e) {
        trmBarEl.innerHTML = `🇺🇸 TRM USD/COP: No disponible sin red`;
      }
    }

    openModalBtn.addEventListener('click', () => {
      editRowIndexInput.value = '';
      modalTitle.textContent = 'Registrar Movimiento';
      transactionForm.reset();
      inputFecha.value = new Date().toISOString().split('T')[0];
      setTipo('Gasto');
      modalOverlay.classList.add('active');
    });

    const closeModal = () => modalOverlay.classList.remove('active');
    closeModalBtn.addEventListener('click', closeModal);

    function setTipo(t) {
      inputTipo.value = t;
      typeBtns.forEach(b => b.classList.toggle('active', b.getAttribute('data-type') === t));
    }

    typeBtns.forEach(btn => btn.addEventListener('click', () => setTipo(btn.getAttribute('data-type'))));

    async function obtenerResumen() {
      mostrarCargando(true);
      try {
        const res = await fetch(URL_WEB_APP);
        const data = await res.json();

        if (data.status === 'success') {
          const fmt = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });
          totalBalanceEl.textContent = fmt.format(data.summary.balanceNeto);
          totalIngresosEl.textContent = fmt.format(data.summary.totalIngresos);
          totalGastosEl.textContent = fmt.format(data.summary.totalGastos);

          cacheTransacciones = data.transacciones || [];
          renderLista(cacheTransacciones);
          renderGraficos(cacheTransacciones);
        }
      } catch (e) {
        console.warn('Error al cargar datos:', e);
      } finally {
        mostrarCargando(false);
      }
    }

    function renderLista(lista) {
      txListEl.innerHTML = '';
      const fmt = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });

      lista.forEach(t => {
        const item = document.createElement('div');
        item.className = 'tx-item';
        const esGasto = String(t.tipo).toLowerCase() === 'gasto';

        item.innerHTML = `
          <div class="tx-info">
            <h4>${t.categoria} ${t.descripcion ? '- ' + t.descripcion : ''}</h4>
            <p>${t.fecha}</p>
          </div>
          <div>
            <div class="tx-amount ${esGasto ? 'gasto' : 'ingreso'}">
              ${esGasto ? '-' : '+'}${fmt.format(t.monto)}
            </div>
            <div class="tx-actions">
              <button class="btn-icon" onclick="prepararEdicion(${t.rowIndex})"><span class="material-symbols-rounded">edit</span></button>
              <button class="btn-icon delete" onclick="eliminarFila(${t.rowIndex})"><span class="material-symbols-rounded">delete</span></button>
            </div>
          </div>
        `;
        txListEl.appendChild(item);
      });
    }

    function prepararEdicion(rowIndex) {
      const item = cacheTransacciones.find(t => t.rowIndex === rowIndex);
      if (!item) return;

      editRowIndexInput.value = rowIndex;
      modalTitle.textContent = 'Editar Movimiento';
      document.getElementById('monto').value = item.monto;
      document.getElementById('categoria').value = item.categoria;
      document.getElementById('descripcion').value = item.descripcion || '';
      inputFecha.value = item.fecha;
      setTipo(item.tipo);

      modalOverlay.classList.add('active');
    }

    async function eliminarFila(rowIndex) {
      if (!confirm('¿Eliminar esta transacción?')) return;
      
      mostrarCargando(true);
      try {
        const res = await fetch(URL_WEB_APP, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'delete', rowIndex: rowIndex })
        });
        const data = await res.json();
        if (data.status === 'success') {
          await obtenerResumen();
        } else {
          alert('Error: ' + data.message);
        }
      } catch (e) {
        alert('Error de red al eliminar.');
      } finally {
        mostrarCargando(false);
      }
    }

    function renderGraficos(lista) {
      const gCat = {};
      lista.forEach(t => {
        if (String(t.tipo).toLowerCase() === 'gasto') {
          gCat[t.categoria] = (gCat[t.categoria] || 0) + parseFloat(t.monto);
        }
      });

      if (chartCatInstance) chartCatInstance.destroy();
      chartCatInstance = new Chart(document.getElementById('chartCategorias'), {
        type: 'doughnut',
        data: {
          labels: Object.keys(gCat),
          datasets: [{ data: Object.values(gCat), backgroundColor: ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899'] }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });

      const meses = {};
      lista.forEach(t => {
        const m = t.fecha ? t.fecha.substring(0, 7) : 'Otros';
        if (!meses[m]) meses[m] = { i: 0, g: 0 };
        if (String(t.tipo).toLowerCase() === 'ingreso') meses[m].i += parseFloat(t.monto);
        else meses[m].g += parseFloat(t.monto);
      });

      const keys = Object.keys(meses).sort();
      if (chartTenInstance) chartTenInstance.destroy();
      chartTenInstance = new Chart(document.getElementById('chartTendencia'), {
        type: 'bar',
        data: {
          labels: keys,
          datasets: [
            { label: 'Ingresos', data: keys.map(k => meses[k].i), backgroundColor: '#10b981' },
            { label: 'Gastos', data: keys.map(k => meses[k].g), backgroundColor: '#ef4444' }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    transactionForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      mostrarCargando(true);

      const rowIndex = editRowIndexInput.value;
      const payload = {
        action: rowIndex ? 'edit' : 'create',
        rowIndex: rowIndex ? parseInt(rowIndex) : undefined,
        fecha: inputFecha.value,
        tipo: inputTipo.value,
        monto: parseFloat(document.getElementById('monto').value),
        categoria: document.getElementById('categoria').value,
        descripcion: document.getElementById('descripcion').value
      };

      try {
        const res = await fetch(URL_WEB_APP, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.status === 'success') {
          closeModal();
          transactionForm.reset();
          await obtenerResumen();
        } else {
          alert('Error: ' + data.message);
        }
      } catch (err) {
        alert('Error de red.');
      } finally {
        mostrarCargando(false);
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      obtenerTRM();
      obtenerResumen();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
